openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: ai
    description: AI-powered features
  - name: auth
    description: Supabase-backed authentication
  - name: sync
    description: Offline-first cloud synchronization
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /ai/discover-companies:
    post:
      operationId: discoverCompanies
      tags: [ai]
      summary: Find nearby companies using AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscoverCompaniesInput"
      responses:
        "200":
          description: List of nearby companies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CompanyDiscovery"

  /ai/draft-letter:
    post:
      operationId: draftLetter
      tags: [ai]
      summary: Draft or polish an application letter using AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftLetterInput"
      responses:
        "200":
          description: Drafted letter text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftLetterResult"

  /ai/research-company:
    post:
      operationId: researchCompany
      tags: [ai]
      summary: Research a company using AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResearchCompanyInput"
      responses:
        "200":
          description: Company research summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchCompanyResult"

  /ai/star-feedback:
    post:
      operationId: starFeedback
      tags: [ai]
      summary: Get AI feedback on a STAR-format interview answer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StarFeedbackInput"
      responses:
        "200":
          description: AI feedback on the STAR answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StarFeedbackResult"

  /ai/profile-chat:
    post:
      operationId: profileChat
      tags: [ai]
      summary: Conversational AI profile setup assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileChatInput"
      responses:
        "200":
          description: AI reply and optional extracted profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileChatResult"

  /ai/cv:
    post:
      operationId: buildCV
      tags: [ai]
      summary: Generate, polish, or tailor a CV using AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CVInput"
      responses:
        "200":
          description: Generated CV text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CVResult"

  /ai/networking-events:
    post:
      operationId: findNetworkingEvents
      tags: [ai]
      summary: Find real networking events from the internet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NetworkingEventsInput"
      responses:
        "200":
          description: List of networking events found on the internet
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NetworkingEvent"

  /ai/interview-questions:
    post:
      operationId: interviewQuestions
      tags: [ai]
      summary: Generate interview questions for a company and role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterviewQuestionsInput"
      responses:
        "200":
          description: Categorised interview questions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewQuestionsResult"

  /auth/signup:
    post:
      operationId: signUp
      tags: [auth]
      summary: Create a Supabase account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCredentials"
      responses:
        "200":
          description: Created account and optional session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCredentials"
      responses:
        "200":
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/refresh:
    post:
      operationId: refreshSession
      tags: [auth]
      summary: Refresh a Supabase session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshSessionInput"
      responses:
        "200":
          description: Refreshed session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      security:
        - bearerAuth: []
      summary: Sign out the current session
      responses:
        "204":
          description: Signed out

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      security:
        - bearerAuth: []
      summary: Get the current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"

  /sync/pull:
    post:
      operationId: pullSync
      tags: [sync]
      security:
        - bearerAuth: []
      summary: Pull cloud records changed since a cursor
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncPullInput"
      responses:
        "200":
          description: Changed records and the next sync cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncPullResult"

  /sync/push:
    post:
      operationId: pushSync
      tags: [sync]
      security:
        - bearerAuth: []
      summary: Apply queued offline mutations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncPushInput"
      responses:
        "200":
          description: Applied mutations and conflicts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncPushResult"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ChatMessage:
      type: object
      required:
        - role
        - content
      properties:
        role:
          type: string
        content:
          type: string

    ProfileChatInput:
      type: object
      required:
        - messages
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"

    ProfileField:
      type: object
      required:
        - label
        - value
      properties:
        label:
          type: string
        value:
          type: string

    ExtractedProfile:
      type: object
      properties:
        displayName:
          type: string
        currentDegree:
          type: string
        institution:
          type: string
        yearOfStudy:
          type: string
        skills:
          type: string
        city:
          type: string
        preferredIndustries:
          type: string
        careerGoals:
          type: string
        portfolioUrl:
          type: string
        profileFields:
          type: array
          items:
            $ref: "#/components/schemas/ProfileField"

    ProfileChatResult:
      type: object
      required:
        - reply
        - isComplete
      properties:
        reply:
          type: string
        isComplete:
          type: boolean
        profileData:
          $ref: "#/components/schemas/ExtractedProfile"

    CVProfile:
      type: object
      properties:
        displayName:
          type: string
        currentDegree:
          type: string
        institution:
          type: string
        yearOfStudy:
          type: string
        skills:
          type: string
        city:
          type: string
        careerGoals:
          type: string
        portfolioUrl:
          type: string
        profileFields:
          type: array
          items:
            $ref: "#/components/schemas/ProfileField"

    CVInput:
      type: object
      required:
        - mode
        - targetIndustry
        - targetRole
        - draft
      properties:
        mode:
          type: string
          enum: [generate, polish]
        targetIndustry:
          type: string
        targetRole:
          type: string
        draft:
          type: string
        profile:
          $ref: "#/components/schemas/CVProfile"

    CVResult:
      type: object
      required:
        - cv
      properties:
        cv:
          type: string

    DiscoverCompaniesInput:
      type: object
      required:
        - latitude
        - longitude
        - degree
      properties:
        latitude:
          type: number
        longitude:
          type: number
        degree:
          type: string
        institution:
          type: string
        yearOfStudy:
          type: string
        skills:
          type: string
        city:
          type: string
        preferredIndustries:
          type: string
        goals:
          type: string

    CompanyDiscovery:
      type: object
      required:
        - name
        - description
        - fitScore
      properties:
        name:
          type: string
        description:
          type: string
        fitScore:
          type: string
        website:
          type: ["string", "null"]

    DraftLetterInput:
      type: object
      required:
        - companyName
        - role
        - degree
        - goals
      properties:
        companyName:
          type: string
        role:
          type: string
        degree:
          type: string
        goals:
          type: string
        institution:
          type: string
        yearOfStudy:
          type: string
        skills:
          type: string
        portfolioUrl:
          type: string
        userDraft:
          type: string

    DraftLetterResult:
      type: object
      required:
        - letter
      properties:
        letter:
          type: string

    ResearchCompanyInput:
      type: object
      required:
        - companyName
      properties:
        companyName:
          type: string

    ResearchCompanyResult:
      type: object
      required:
        - summary
      properties:
        summary:
          type: string

    StarFeedbackInput:
      type: object
      required:
        - question
        - situation
        - task
        - action
        - result
      properties:
        question:
          type: string
        situation:
          type: string
        task:
          type: string
        action:
          type: string
        result:
          type: string

    StarFeedbackResult:
      type: object
      required:
        - feedback
      properties:
        feedback:
          type: string

    InterviewQuestionsInput:
      type: object
      required:
        - companyName
        - role
        - degree
        - goals
      properties:
        companyName:
          type: string
        role:
          type: string
        degree:
          type: string
        goals:
          type: string
        institution:
          type: string
        yearOfStudy:
          type: string
        skills:
          type: string
        researchSummary:
          type: string

    NetworkingEventsInput:
      type: object
      required:
        - city
      properties:
        city:
          type: string
        degree:
          type: string
        preferredIndustries:
          type: string
        goals:
          type: string

    NetworkingEvent:
      type: object
      required:
        - id
        - title
        - eventType
        - organizer
        - dateLabel
        - location
      properties:
        id:
          type: string
        title:
          type: string
        eventType:
          type: string
        organizer:
          type: string
        dateLabel:
          type: string
        dateIso:
          type: string
        location:
          type: string
        description:
          type: string
        url:
          type: string
        source:
          type: string
        tags:
          type: array
          items:
            type: string
        isOnline:
          type: boolean

    InterviewQuestionsResult:
      type: object
      required:
        - personal
        - company
        - experience
      properties:
        personal:
          type: array
          items:
            type: string
        company:
          type: array
          items:
            type: string
        experience:
          type: array
          items:
            type: string

    AuthCredentials:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8

    RefreshSessionInput:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    AuthUser:
      type: object
      required: [id, email]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        createdAt:
          type: string
        lastSignInAt:
          type: string

    AuthSession:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn, user]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
        expiresIn:
          type: integer
        expiresAt:
          type: integer
        user:
          $ref: "#/components/schemas/AuthUser"

    AuthResponse:
      type: object
      required: [session]
      properties:
        session:
          anyOf:
            - $ref: "#/components/schemas/AuthSession"
            - type: "null"
        user:
          anyOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
        requiresEmailConfirmation:
          type: boolean

    SyncPullInput:
      type: object
      properties:
        since:
          type: string
        entities:
          type: array
          items:
            type: string

    SyncRecord:
      type: object
      required: [entity, recordId, payload, updatedAt, deletedAt]
      properties:
        entity:
          type: string
        recordId:
          type: string
        payload:
          type: object
          additionalProperties: true
        updatedAt:
          type: string
        deletedAt:
          anyOf:
            - type: string
            - type: "null"

    SyncPullResult:
      type: object
      required: [records, cursor]
      properties:
        records:
          type: array
          items:
            $ref: "#/components/schemas/SyncRecord"
        cursor:
          type: string

    SyncMutation:
      type: object
      required: [idempotencyKey, entity, recordId, operation, updatedAt]
      properties:
        idempotencyKey:
          type: string
        entity:
          type: string
        recordId:
          type: string
        operation:
          type: string
          enum: [upsert, delete]
        payload:
          type: object
          additionalProperties: true
        updatedAt:
          type: string

    SyncPushInput:
      type: object
      required: [mutations]
      properties:
        mutations:
          type: array
          items:
            $ref: "#/components/schemas/SyncMutation"

    SyncPushResult:
      type: object
      required: [applied, conflicts, cursor]
      properties:
        applied:
          type: array
          items:
            type: string
        conflicts:
          type: array
          items:
            $ref: "#/components/schemas/SyncRecord"
        cursor:
          type: string
